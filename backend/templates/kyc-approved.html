<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYC Approved | Meraki Auto</title>
</head>
<body style="margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; background:#f4f6f9;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9; padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.08); padding:40px; text-align:center;">

          <!-- Icon -->
          <tr>
            <td style="font-size:60px; padding-bottom:20px; color:#2ecc71;">
              &#10004;
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td style="font-size:24px; font-weight:bold; color:#111; padding-bottom:15px;">
              KYC Approved
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td style="font-size:16px; color:#555; line-height:1.6; padding-bottom:10px;">
              Hello {{USER_NAME}},
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="font-size:16px; color:#555; line-height:1.6; padding-bottom:30px;">
              Congratulations! Your identity verification has been successfully approved.
              You now have full access to the platform.
            </td>
          </tr>

          <!-- CTA Button -->
          <tr>
            <td>
              <a href="{{FRONTEND_URL}}/login.html"
                 style="display:inline-block; background:#000; color:#fff; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:bold; font-size:16px;">
                Login to Your Account
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="font-size:13px; color:#999; padding-top:30px; line-height:1.5;">
              If you did not create an account, you can safely ignore this email.<br />
              &copy; Meraki Auto
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
