<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meraki Auto — All Vehicles</title>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/index-premium.css" />
  <link rel="stylesheet" href="css/avatar-dropdown.css" />
  <link rel="stylesheet" href="css/view-all.css" />
</head>

<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <nav id="mainNavbar" class="alina-navbar">
    <div class="navbar-inner">
      <div class="navbar-row1">
        <a class="navbar-logo" href="index.html">Meraki Auto</a>
        <ul class="navbar-links">
          <li><a href="index.html" data-page="index">Home</a></li>
          <li><a href="about.html" data-page="about">About</a></li>
          <li><a href="contact.html" data-page="contact">Contact</a></li>
        </ul>
      </div>
      <div class="navbar-row2">
        <div class="navbar-actions">
          <span class="nav-welcome" id="navWelcome"></span>
          <a id="loginLink" href="login.html" class="nav-btn nav-btn-outline">Sign In</a>
          <a id="signupLink" href="signup.html" class="nav-btn nav-btn-solid">Sign Up</a>
          <div class="wallet-area" id="navWalletWrapper">
            <button id="connectWallet" class="wallet-connect-btn">
              <span class="wallet-icon">🦊</span> Connect Wallet
            </button>
            <div id="walletInfoRow" class="wallet-connected" style="display:none;">
              <span class="wallet-status-dot"></span>
              <span id="walletAddress" class="wallet-addr">—</span>
              <button id="disconnectWallet" class="wallet-disconnect-btn">✕</button>
            </div>
          </div>
          <div id="avatarDropdown" class="avatar-area" style="display:none;">
            <button class="avatar-btn" id="avatarToggle" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
              <span class="avatar-initials" id="avatarInitials">?</span>
              <span class="avatar-name" id="avatarName">User</span>
            </button>
            <div class="avatar-menu" id="avatarMenu" role="menu">
              <a href="my_booking.html" class="avatar-menu-item">📋 My Bookings</a>
              <a href="dashboard.html" class="avatar-menu-item">👤 Account</a>
              <div class="avatar-menu-item kyc-status-item">
                🛡️ KYC Status <span id="kycBadge" class="kyc-badge">—</span>
              </div>
              <hr class="avatar-menu-divider">
              <button id="logoutBtn" class="avatar-menu-item logout-item">🚪 Log Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="market-page" aria-label="All Vehicles Marketplace">
    <section class="market-top" aria-label="Marketplace controls">
      <div class="index-container">
        <div class="market-top__head">
          <div>
            <h1 class="market-title">All Vehicles</h1>
            <p class="market-sub">Search, sort, and filter across the full Meraki fleet.</p>
          </div>
          <button id="filtersToggle" class="index-btn index-btn--secondary market-filters-toggle" type="button">Filters</button>
        </div>

        <div class="market-controls">
          <div class="market-search">
            <input id="marketSearchInput" class="market-search__input" type="text" placeholder="Search by car name or location" autocomplete="off" />
            <button id="marketSearchBtn" class="market-search__btn" type="button" aria-label="Search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              Search
            </button>
          </div>

          <div class="market-sort">
            <label class="market-sort__label" for="sortSelect">Sort By</label>
            <select id="sortSelect" class="market-sort__select">
              <option value="newest">Newest</option>
              <option value="price_low">Lowest Price</option>
              <option value="price_high">Highest Price</option>
              <option value="az">Alphabetical (A-Z)</option>
              <option value="za">Alphabetical (Z-A)</option>
            </select>
          </div>
        </div>

        <p id="marketMeta" class="market-meta" style="display:none;"></p>
      </div>
    </section>

    <section class="market-body" aria-label="Marketplace results">
      <div class="index-container">
        <div class="market-layout">
          <aside id="filtersSidebar" class="market-filters" aria-label="Filters">
            <div class="market-filters__inner">
              <div class="market-filter">
                <h3 class="market-filter__title">Category</h3>
                <label class="market-check"><input type="checkbox" name="category" value="premium" /> Premium</label>
                <label class="market-check"><input type="checkbox" name="category" value="everyday" /> Everyday</label>
                <label class="market-check"><input type="checkbox" name="category" value="enthusiast" /> Enthusiast</label>
                <label class="market-check"><input type="checkbox" name="category" value="utility" /> Utility</label>
                <label class="market-check"><input type="checkbox" name="category" value="motorbike" /> Motorbike</label>
                <label class="market-check"><input type="checkbox" name="category" value="public" /> Public</label>
              </div>

              <div class="market-filter">
                <h3 class="market-filter__title">Max Price (KES/day)</h3>
                <input id="priceRange" class="market-range" type="range" min="0" max="300000" step="500" value="300000" />
                <div class="market-range__row">
                  <span class="market-range__min">0</span>
                  <span id="priceRangeValue" class="market-range__value">300,000</span>
                </div>
              </div>

              <div class="market-filter">
                <h3 class="market-filter__title">Transmission</h3>
                <select id="transmissionSelect" class="market-select">
                  <option value="">Any</option>
                  <option value="automatic">Automatic</option>
                  <option value="manual">Manual</option>
                </select>
              </div>

              <div class="market-filter">
                <h3 class="market-filter__title">Fuel Type</h3>
                <select id="fuelSelect" class="market-select">
                  <option value="">Any</option>
                  <option value="petrol">Petrol</option>
                  <option value="diesel">Diesel</option>
                  <option value="hybrid">Hybrid</option>
                  <option value="electric">Electric</option>
                </select>
              </div>

              <div class="market-filter">
                <h3 class="market-filter__title">Location</h3>
                <input id="locationInput" class="market-input" type="text" placeholder="e.g. Nairobi, Westlands" autocomplete="off" />
              </div>

              <div class="market-filter__actions">
                <button id="clearFilters" class="index-btn index-btn--secondary" type="button">Clear Filters</button>
              </div>
            </div>
          </aside>

          <div class="market-results">
            <div id="marketStatus" class="market-status" style="display:none;"></div>
            <div id="vehiclesGrid" class="featured-grid market-grid"></div>

            <div class="market-load">
              <button id="loadMoreBtn" class="index-btn index-btn--primary" type="button" style="display:none;">Load More</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Built on Polygon Amoy Testnet &nbsp;·&nbsp; 2025 Meraki Auto
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/view-all.js"></script>
</body>

</html>
